# Runs the automatic tests on every push and pull request: the browser-side modules (Node, no install) and the backend (pytest).
# Neither needs real SPHEREx data or the network: the backend tests make synthetic FITS files on the fly, and the Node tests use
# synthetic fields and tiny invented maps. (The real-data scripts in scratch/ need the local cutouts and are NOT run here.)
#
# Action versions are the ones pages.yml already uses plus setup-node / setup-python v4 / v5, written from memory: if a run says
# a version does not exist, change it. Python 3.14 is what the backend was tested with; if the runner cannot find it yet,
# try "3.13".
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Browser-side modules (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run every scratch/test_*.mjs
        run: |
          status=0
          for f in scratch/test_*.mjs; do
            echo "::group::$f"
            node "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  # A smoke test of the whole page in a real browser (headless Chrome over the DevTools Protocol, Node only, no npm): scratch/e2e_smoke.mjs serves
  # frontend/ itself and uses the SYNTHETIC demo, so it needs neither the backend nor the network. It needs Node 22+ (the built-in WebSocket) and a Chrome
  # or Edge: the ubuntu-latest image is believed to ship google-chrome (from memory, NOT yet seen in a run of this workflow). If the run says "SKIP no Chrome
  # or Edge found", the job fails on purpose (exit 2): install Chrome in an extra step or set CHROME_PATH.
  e2e:
    name: Page smoke test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Walk the main path in the browser
        run: node scratch/e2e_smoke.mjs

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend -q
