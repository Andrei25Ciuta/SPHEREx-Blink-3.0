<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real or fake? · SPHEREx Blink</title>
  <link rel="stylesheet" href="css/styles.css?v=20261115">
  <link rel="stylesheet" href="css/instrument.css?v=20261115">
  <link rel="stylesheet" href="css/real-or-fake.css?v=daily-scores">
</head>
<body>
  <a class="skip-link" href="#classification">Skip to the game</a>
  <header class="site-header" data-page="training">
    <a class="site-brand" href="overview.html">SPHEREx Blink</a>
    <select id="theme-select" data-default-theme="midnight" aria-label="Colour theme"></select>
  </header>
  <script type="module" src="js/siteHeader.js?v=4"></script>
  <main id="classification" tabindex="-1">
    <a class="classification-back" href="daily.html">← Training</a>
    <div class="classification-heading">
      <h1>Real or Fake?</h1>
      <span class="pb-chip">Synthetic training</span>
    </div>
    <p>Everyone gets the same ten signals each day. You have ten seconds per question.</p>
    <p id="classification-question" class="classification-progress">Question 1 of 10</p>

    <div class="classification-game">
      <div>
        <label class="classification-clock">
          <span aria-hidden="true"><strong id="classification-seconds">10</strong> s</span>
          <progress id="classification-time" value="10" max="10" aria-label="Seconds remaining"></progress>
        </label>
        <div class="classification-viewer">
          <canvas id="classification-image" width="48" height="48" role="img"
            aria-label="Simulated sky field with the candidate area marked"></canvas>
          <div id="classification-ready" class="classification-cover">
            <button type="button" id="classification-start" class="btn btn-primary">Start quiz</button>
          </div>
        </div>
        <div class="classification-frames" role="group" aria-label="Observations">
          <button type="button" class="btn" data-classification-frame="0" aria-label="Frame 1" disabled>1</button>
          <button type="button" class="btn" data-classification-frame="1" aria-label="Frame 2" disabled>2</button>
          <button type="button" class="btn" data-classification-frame="2" aria-label="Frame 3" disabled>3</button>
          <button type="button" class="btn" id="classification-blink" aria-pressed="false" disabled>Blink</button>
        </div>
      </div>

      <div class="classification-side">
        <section class="classification-guess" aria-labelledby="classification-choices">
          <h2 id="classification-choices">What is the marked signal?</h2>
          <div class="classification-answers" role="group" aria-labelledby="classification-choices">
            <button type="button" class="btn" data-classification-answer="real" disabled>
              <span aria-hidden="true" class="classification-symbol">▲</span>
              <strong>Real</strong><small>Star or asteroid</small>
            </button>
            <button type="button" class="btn" data-classification-answer="fake" disabled>
              <span aria-hidden="true" class="classification-symbol">◆</span>
              <strong>Fake</strong><small>Image artefact</small>
            </button>
          </div>
          <div id="classification-result" class="classification-result" role="status"></div>
          <form id="classification-share-score" class="classification-share" hidden>
            <label for="classification-nickname">Public nickname</label>
            <div>
              <input id="classification-nickname" type="text" maxlength="40" required autocomplete="off">
              <button id="classification-publish-score" type="submit" class="btn">Post score</button>
            </div>
            <p id="classification-share-status" role="status"></p>
          </form>
          <button type="button" id="classification-next" class="btn btn-primary" hidden>Next question</button>
        </section>

        <section class="classification-board" aria-labelledby="classification-board-heading">
          <div class="classification-board-heading">
            <div>
              <h2 id="classification-board-heading">Today’s leaderboard</h2>
              <p id="classification-board-date"></p>
            </div>
            <button id="classification-refresh-board" type="button" class="btn btn-small">Refresh</button>
          </div>
          <p class="classification-board-rule">Most correct answers first. Fastest time breaks ties.</p>
          <p id="classification-board-status" role="status"></p>
          <ol id="classification-scores" aria-label="Daily rankings"></ol>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="js/realOrFake.js?v=daily-scores"></script>
</body>
</html>
